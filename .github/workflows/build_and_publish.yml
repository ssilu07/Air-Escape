name: Build and Publish Android Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Tag for release (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'
      upload_play_store:
        description: 'Upload AAB to Google Play'
        required: true
        type: boolean
        default: true
      play_track:
        description: 'Play Store Track'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release_keystore.jks
            echo "KEYSTORE_FILE=${{ github.workspace }}/release_keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Keystore successfully configured from GitHub Secrets."
          else
            echo "No KEYSTORE_BASE64 secret provided. Generating valid fallback keystore for CI..."
            keytool -genkeypair -v -keystore release_keystore.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass 8750257510 -keypass 8750257510 -dname "CN=AirEscape, OU=Royals, O=Royals, L=Delhi, S=Delhi, C=IN"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release_keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=8750257510" >> $GITHUB_ENV
            echo "KEY_ALIAS=key0" >> $GITHUB_ENV
            echo "KEY_PASSWORD=8750257510" >> $GITHUB_ENV
          fi

      - name: Build Release APK & Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="release-v1.3-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "AirEscape ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ### 🚀 AirEscape Release
            
            **What's New:**
            * Earning System: Collect Stars to earn Coins (**1 Star = 1 Coin**).
            * Supabase Cloud Wallet: Cloud wallet persistence and isolated user accounts.
            * UPI / Paytm Withdrawals: Direct in-app withdrawal request system.
            * Performance improvements & bug fixes.

            **Assets:**
            * Direct APK download: `app-release.apk`
            * Google Play Bundle: `app-release.aab`
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Play Store Deployment Configuration
        id: play_check
        run: |
          if [ -n "${{ secrets.PLAY_STORE_JSON_KEY }}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload_play_store }}" = "false" ]; then
              echo "deploy=false" >> $GITHUB_OUTPUT
              echo "Play Store upload disabled by user input."
            else
              echo "deploy=true" >> $GITHUB_OUTPUT
              echo "Play Store upload enabled."
            fi
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::warning ::PLAY_STORE_JSON_KEY secret not found in GitHub Secrets. Skipping Play Store upload."
          fi

      - name: Deploy to Google Play Console
        if: steps.play_check.outputs.deploy == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.royals.airescape
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed
